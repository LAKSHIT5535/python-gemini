            background: #475569; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b; 
        }

        /* Lesson Content Styling */
        .lesson-prose h3 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-top: 1.5rem;
            margin-bottom: 0.75rem;
            color: #e2e8f0;

            color: #cbd5e1;

            padding: 0.15rem 0.35rem;
            border-radius: 0.25rem;
            font-family: 'Fira Code', monospace;
            font-size: 0.875em;

            background-color: #1e293b;
            padding: 1rem;
            border-radius: 0.5rem;
            overflow-x: auto;
            margin-bottom: 1rem;
            border: 1px solid #334155;
        }
        .lesson-prose ul {
            list-style-type: disc;
            padding-left: 1.5rem;
            margin-bottom: 1rem;
            color: #cbd5e1;
        }
        .lesson-prose li {
            margin-bottom: 0.5rem;
        }

        /* Ace Editor Container */
        #editor-container {
            position: relative;
            flex-grow: 1;
        }
        #editor {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;

            background-color: #000000;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 1s ease-out;
        }
        
        #loading-video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
        }

                    <p><strong>Generators</strong> allow you to declare a function that behaves like an iterator. They allow programmers to make an iterator in a fast, easy, and clean way.</p>
                    <p>Instead of <code>return</code>, you use <code>yield</code>. This saves state and pauses execution, which is highly memory efficient for large datasets.</p>
                    <pre class="block-code text-blue-300">def count_to_three():
    yield 1
    yield 2
    yield 3

for num in count_to_three():
    print(num)</pre>
                `,
                exercise: "Write a generator function 'even_numbers' that yields the first 3 even numbers (2, 4, 6). Iterate over it with a for loop and print them.",
                initialCode: "def even_numbers():\n    # write your yields here\n    pass\n\n# Loop over the generator and print:\n"
            }
        ];

        let currentLessonIndex = 0;
        let editor;

        // DOM Elements
        const curriculumListEl = document.getElementById('curriculum-list');
        const lessonCategoryEl = document.getElementById('lesson-category');
        const lessonTitleEl = document.getElementById('lesson-title');
        const lessonBodyEl = document.getElementById('lesson-body');
        const lessonExerciseEl = document.getElementById('lesson-exercise');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const resetBtn = document.getElementById('reset-btn');
        const progressIndicator = document.getElementById('progress-indicator');
        const consoleOutput = document.getElementById('console-output');
        const terminalPlaceholder = document.getElementById('terminal-placeholder');

        // Initialize Ace Editor
        function initEditor() {
            editor = ace.edit("editor");
            editor.setTheme("ace/theme/monokai");
            editor.session.setMode("ace/mode/python");
            editor.setOptions({
                fontSize: "14px",
                fontFamily: "Fira Code, monospace",
                showPrintMargin: false,
                enableBasicAutocompletion: true,
                enableLiveAutocompletion: true,
            });
            // Global function so Brython can easily access it
            window.getEditorCode = function() {
                return editor.getValue();
            };
        }

        // Initialize Sidebar Curriculum
        function initSidebar() {
            let currentCategory = "";
            
            curriculum.forEach((lesson, index) => {
                // Add category header if it changes
                if (lesson.category !== currentCategory) {
                    currentCategory = lesson.category;
                    const catHeader = document.createElement('div');
                    catHeader.className = "px-5 mt-6 mb-2 text-xs font-bold text-slate-500 uppercase tracking-widest";
                    catHeader.textContent = currentCategory;
                    curriculumListEl.appendChild(catHeader);
                }

                // Add lesson link
                const btn = document.createElement('button');
                btn.className = `w-full text-left px-5 py-2.5 text-sm transition-colors border-l-2 ${index === 0 ? 'border-blue-500 bg-slate-800 text-white' : 'border-transparent text-slate-400 hover:text-slate-200 hover:bg-slate-800/50'}`;
                btn.textContent = `${lesson.id}. ${lesson.title}`;
                btn.id = `nav-lesson-${index}`;
                btn.onclick = () => loadLesson(index);
                curriculumListEl.appendChild(btn);
            });
        }

        // Load Lesson Logic
        function loadLesson(index) {
            currentLessonIndex = index;
            const lesson = curriculum[index];
            
            // Update Sidebar UI
            curriculum.forEach((_, i) => {
                const btn = document.getElementById(`nav-lesson-${i}`);
                if (i === index) {
                    btn.className = "w-full text-left px-5 py-2.5 text-sm transition-colors border-l-2 border-blue-500 bg-slate-800 text-white";
                } else {
                    btn.className = "w-full text-left px-5 py-2.5 text-sm transition-colors border-l-2 border-transparent text-slate-400 hover:text-slate-200 hover:bg-slate-800/50";
                }
            });

            // Update Theory Content
            lessonCategoryEl.textContent = lesson.category;
            lessonTitleEl.textContent = lesson.title;
            lessonBodyEl.innerHTML = lesson.content;
            lessonExerciseEl.innerHTML = lesson.exercise;
            
            // Update Editor
            editor.setValue(lesson.initialCode, -1); // -1 moves cursor to top
            
            // Clear Console
            clearConsole();

            // Update Buttons & Progress
            prevBtn.disabled = index === 0;
            nextBtn.disabled = index === curriculum.length - 1;
            progressIndicator.textContent = `${index + 1} / ${curriculum.length}`;
        }

        function clearConsole() {
            consoleOutput.textContent = "";
            terminalPlaceholder.style.display = "block";
        }

        // Event Listeners
        prevBtn.onclick = () => {
            if (currentLessonIndex > 0) loadLesson(currentLessonIndex - 1);
        };

        nextBtn.onclick = () => {
            if (currentLessonIndex < curriculum.length - 1) loadLesson(currentLessonIndex + 1);
        };

        resetBtn.onclick = () => {
            if(confirm("Reset editor to starter code?")) {
                editor.setValue(curriculum[currentLessonIndex].initialCode, -1);
                clearConsole();
            }
        };

        document.getElementById('clear-btn').onclick = clearConsole;

        // Hide placeholder when terminal receives text
        const observer = new MutationObserver((mutations) => {
            mutations.forEach((mutation) => {
                if (consoleOutput.textContent.trim() !== "") {
                    terminalPlaceholder.style.display = "none";
                } else {
                    terminalPlaceholder.style.display = "block";
                }
            });
        });
        observer.observe(consoleOutput, { childList: true, characterData: true, subtree: true });

        // Init App
        window.addEventListener('DOMContentLoaded', () => {
            const loadingScreen = document.getElementById('loading-screen');
            const loadingVideo = document.getElementById('loading-video');
            
            const removeLoadingScreen = () => {
                loadingScreen.style.opacity = '0';
                setTimeout(() => {
                    loadingScreen.style.display = 'none';
                }, 1000); // Wait for the 1s CSS opacity transition
            };

            // Listen for the video to finish playing
            if (loadingVideo) {
                loadingVideo.addEventListener('ended', removeLoadingScreen);
                
                // Fallbacks in case the video fails to load or autoplay is blocked by the browser
                loadingVideo.addEventListener('error', removeLoadingScreen);
                setTimeout(() => {
                    if (loadingScreen.style.display !== 'none' && loadingVideo.paused && loadingVideo.currentTime === 0) {
                        removeLoadingScreen();
                    }
                }, 3000);
            } else {
                removeLoadingScreen();
            }

            initEditor();
            initSidebar();
            loadLesson(0);
        });

    </script>

    <script type="text/python">
        from browser import document, window
        import sys
        import traceback

        # Custom stream to capture output and route it to our HTML mock terminal
        class OutputWrapper:
            def __init__(self, element_id, is_error=False):
                self.console = document[element_id]
                self.is_error = is_error

            def write(self, text):
                # If it's an error stream, wrap in a red span
                if self.is_error:
                    # Basic HTML escaping to prevent breaking the pre tag
                    safe_text = text.replace("<", "&lt;").replace(">", "&gt;")
                    self.console.html += f'<span class="text-red-400">{safe_text}</span>'
                else:
                    safe_text = text.replace("<", "&lt;").replace(">", "&gt;")
                    self.console.html += safe_text
                
                # Auto-scroll to bottom
                self.console.parent.scrollTop = self.console.parent.scrollHeight

            def flush(self):
                pass # Required by some Python internal prints, but no-op here

        # Redirect standard output and error
        sys.stdout = OutputWrapper("console-output", is_error=False)
        sys.stderr = OutputWrapper("console-output", is_error=True)

        def execute_code(event):
            # Clear console before running
            document["console-output"].html = ""
            
            # Fetch code via our global JS function exposing Ace Editor's value
            code = window.getEditorCode()
            
            # Use an empty dictionary for locals/globals to isolate execution environment per run
            # This prevents state leakage between executions (e.g. modifying a variable in run 1 and expecting it in run 2, which is bad for learning platforms).
            env = {} 
            
            try:
                # Execute the python string
                exec(code, env)
            except Exception as e:
                # Print traceback to stderr (which is now our red terminal output)
                traceback.print_exc(file=sys.stderr)

        # Bind the run button click to execute_code
        document["run-btn"].bind("click", execute_code)
    </script>
